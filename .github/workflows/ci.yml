name: Monitoring smoke test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t monitoring-demo:local .
      - name: Verify the demo API
        run: |
          docker run -d --rm --name demo-api -p 127.0.0.1:8000:8000 monitoring-demo:local
          trap 'docker stop demo-api' EXIT
          base_url=http://127.0.0.1:8000
          if ! curl --retry 15 --retry-all-errors --retry-delay 1 --max-time 2 -fsS "$base_url/healthz"; then
            docker logs demo-api
            exit 1
          fi
          ./smoke.sh "$base_url"
      - name: Validate Prometheus alert rules
        run: docker run --rm --entrypoint /bin/promtool -v "$PWD:/work:ro" prom/prometheus:v3.4.2 check rules /work/alerts.yml
